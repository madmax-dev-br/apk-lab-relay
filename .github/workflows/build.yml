# Tests, builds the executable of each system and, for a version tag (v1.2.3), publishes them as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the executable
        run: node scripts/build-sea.mjs --target ${{ matrix.target }}
      - name: Smoke test the executable
        run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: apk-lab-relay-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the app's version
        run: |
          version="$(node -p "require('./package.json').version")"
          app="$(node -p "require('./src/relay.cjs').VERSION")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
          test "$app" = "$version" || { echo "src/relay.cjs VERSION $app, package.json $version"; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "APK Lab Relay $GITHUB_REF_NAME" --generate-notes --verify-tag
